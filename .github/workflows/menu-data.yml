# data/menu.xlsx(데이터팀 엑셀)가 바뀌면 data/restaurants.json을 다시 만들어 커밋한다.
# 커밋이 올라가면 Vercel이 자동으로 다시 배포한다.
name: 메뉴 데이터 반영

on:
  push:
    branches: [main]
    paths:
      - data/menu.xlsx
      - tools/xlsx_to_json.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: menu-data
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: openpyxl 설치
        run: pip install openpyxl==3.1.5

      - name: 엑셀 → JSON 변환 (오류가 있으면 여기서 멈추고 앱은 이전 데이터 유지)
        run: python tools/xlsx_to_json.py data/menu.xlsx

      - name: 바뀐 데이터 커밋
        run: |
          if git diff --quiet -- data/restaurants.json; then
            echo "restaurants.json 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/restaurants.json
          git commit -m "메뉴 데이터 자동 반영 (data/menu.xlsx)"
          git push
